# 推送 Docker 镜像到 ghcr.io
#
# 触发：
#   - push 到 main → 标 `latest` + `sha-<short>`
#   - push tag vX.Y.Z → 标 `X.Y.Z` + `X.Y` + `X` + `latest`
#   - 手动 workflow_dispatch
#
# 3 个镜像并行构建（matrix）：
#   ghcr.io/yishuiliunian/nexusapi-server
#   ghcr.io/yishuiliunian/nexusapi-web-user
#   ghcr.io/yishuiliunian/nexusapi-web-admin

name: Publish Docker images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    name: ${{ matrix.component }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # ghcr.io push
      attestations: write # cosign / provenance
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            dockerfile: backend/Dockerfile
          - component: web-user
            dockerfile: web-user/Dockerfile
          - component: web-admin
            dockerfile: web-admin/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nexusapi-${{ matrix.component }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max
          platforms: linux/amd64
