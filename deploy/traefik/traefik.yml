# Traefik v3 静态配置
#
# 入口：
#   web    :80    Cloudflare 回源入口（公网），明文 HTTP（TLS 由 CF 终结）
#   admin  :3443  admin 专用入口，限 TS 网段
#
# 路由来源：
#   - docker provider（labels on service）—— 主要方式，容器起停自动同步
#   - file provider（/etc/traefik/dynamic）—— 放可复用 middleware

global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

accessLog:
  format: json
  filters:
    statusCodes:
      - "400-499"
      - "500-599"

entryPoints:
  web:
    address: ":80"
    forwardedHeaders:
      trustedIPs:
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
  admin:
    address: ":3443"

providers:
  docker:
    exposedByDefault: false
    network: nexusapi_default
  file:
    directory: /etc/traefik/dynamic
    watch: true
