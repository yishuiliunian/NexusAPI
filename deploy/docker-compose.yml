# NexusAPI docker-compose · 精简单机部署
#
# 架构（5 个 service）：
#   postgres   数据持久化
#   server     Go backend（启动时 AutoMigrate）
#   web-user   Next.js 用户端
#   web-admin  Next.js 管理台
#   traefik    反向代理（file provider）
#
# 镜像：GitHub Actions 自动构建推送到 ghcr.io（见 .github/workflows/publish.yml）
#   ghcr.io/yishuiliunian/nexusapi-server:latest
#   ghcr.io/yishuiliunian/nexusapi-web-user:latest
#   ghcr.io/yishuiliunian/nexusapi-web-admin:latest
#
# 远端部署：
#   1. cp .env.example .env && 修改
#   2. docker compose pull
#   3. docker compose up -d
#
# 本地开发构建（非必需）：
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml build

name: nexusapi

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    image: ghcr.io/yishuiliunian/nexusapi-server:${NEXUSAPI_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NEXUSAPI_APP_ENV: ${NEXUSAPI_APP_ENV:-prod}
      NEXUSAPI_SERVER_HOST: 0.0.0.0
      NEXUSAPI_SERVER_PORT: 8080
      NEXUSAPI_DATABASE_DRIVER: postgres
      NEXUSAPI_DATABASE_DSN: ${NEXUSAPI_DATABASE_DSN}
      NEXUSAPI_LOG_LEVEL: ${NEXUSAPI_LOG_LEVEL:-info}
      NEXUSAPI_LOG_FORMAT: ${NEXUSAPI_LOG_FORMAT:-json}
      NEXUSAPI_SECURITY_CRYPTO_SECRET: ${NEXUSAPI_SECURITY_CRYPTO_SECRET}
      NEXUSAPI_BILLING_STRICT_PRICING: ${NEXUSAPI_BILLING_STRICT_PRICING:-true}
      NEXUSAPI_BILLING_AUTO_SYNC_ON_STARTUP: ${NEXUSAPI_BILLING_AUTO_SYNC_ON_STARTUP:-true}

  web-user:
    image: ghcr.io/yishuiliunian/nexusapi-web-user:${NEXUSAPI_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - server
    environment:
      NEXUSAPI_BACKEND_URL: http://server:8080
      PORT: 3000
      HOSTNAME: 0.0.0.0

  web-admin:
    image: ghcr.io/yishuiliunian/nexusapi-web-admin:${NEXUSAPI_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - server
    environment:
      NEXUSAPI_BACKEND_URL: http://server:8080
      PORT: 3001
      HOSTNAME: 0.0.0.0

  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --configfile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
      - "3443:3443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    depends_on:
      - server
      - web-user
      - web-admin

volumes:
  pgdata:
