# NexusAPI docker-compose · 精简单机部署
#
# 架构（5 个 service）：
#   postgres   数据持久化
#   server     Go backend（启动时 AutoMigrate 自动建表）
#   web-user   Next.js 用户端
#   web-admin  Next.js 管理台
#   traefik    反向代理（file provider，不依赖 docker.sock / API 协商）
#
# 路由来源：traefik/dynamic/routes.yml（静态写死，file provider watch 热加载）
#   - 好处：Traefik 无需连 docker socket，Docker 版本可自由升降
#   - 原因：Traefik 所有版本的 docker provider 还在用硬编码 API 1.24 做协商，
#          Docker 29+ 废弃 <1.40 API 后 docker provider 直接不可用
#
# 路由：
#   :80   → Cloudflare 橙云回源入口
#           /api/*, /v1/* 等 → server    其他 → web-user
#   :3443 → admin 专用入口（IPAllowList 100.64.0.0/10 仅放行 TS 网段）
#           /api/*, /v1/* 等 → server    其他 → web-admin
#
# 使用：
#   1. cp .env.example .env && 修改 POSTGRES_PASSWORD 和 CRYPTO_SECRET
#   2. docker compose up -d --build

name: nexusapi

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    image: nexusapi/server:${NEXUSAPI_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NEXUSAPI_APP_ENV: ${NEXUSAPI_APP_ENV:-prod}
      NEXUSAPI_SERVER_HOST: 0.0.0.0
      NEXUSAPI_SERVER_PORT: 8080
      NEXUSAPI_DATABASE_DRIVER: postgres
      NEXUSAPI_DATABASE_DSN: ${NEXUSAPI_DATABASE_DSN}
      NEXUSAPI_LOG_LEVEL: ${NEXUSAPI_LOG_LEVEL:-info}
      NEXUSAPI_LOG_FORMAT: ${NEXUSAPI_LOG_FORMAT:-json}
      NEXUSAPI_SECURITY_CRYPTO_SECRET: ${NEXUSAPI_SECURITY_CRYPTO_SECRET}
      NEXUSAPI_BILLING_USD_TO_CNY: ${NEXUSAPI_BILLING_USD_TO_CNY:-7.2}
      NEXUSAPI_BILLING_STRICT_PRICING: ${NEXUSAPI_BILLING_STRICT_PRICING:-true}
      NEXUSAPI_BILLING_AUTO_SYNC_ON_STARTUP: ${NEXUSAPI_BILLING_AUTO_SYNC_ON_STARTUP:-true}

  web-user:
    image: nexusapi/web-user:${NEXUSAPI_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: web-user/Dockerfile
    restart: unless-stopped
    depends_on:
      - server
    environment:
      NEXUSAPI_BACKEND_URL: http://server:8080
      PORT: 3000
      HOSTNAME: 0.0.0.0

  web-admin:
    image: nexusapi/web-admin:${NEXUSAPI_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: web-admin/Dockerfile
    restart: unless-stopped
    depends_on:
      - server
    environment:
      NEXUSAPI_BACKEND_URL: http://server:8080
      PORT: 3001
      HOSTNAME: 0.0.0.0

  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --configfile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
      - "3443:3443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    depends_on:
      - server
      - web-user
      - web-admin

volumes:
  pgdata:
